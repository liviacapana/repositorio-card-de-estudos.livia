<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Rotinas - Estudo, Lazer & Trabalho</title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Elementos 3D em degradê flutuando ao fundo -->
  <div class="bg-scene">
    <div class="shape notebook notebook-1">
      <div class="notebook-cover"></div>
      <div class="notebook-spine"></div>
    </div>
    <div class="shape pencil pencil-1">
      <div class="pencil-body"></div>
      <div class="pencil-tip"></div>
    </div>
    <div class="shape bulb bulb-1">
      <div class="bulb-glass"></div>
      <div class="bulb-base"></div>
    </div>
    <div class="shape notebook notebook-2">
      <div class="notebook-cover"></div>
      <div class="notebook-spine"></div>
    </div>
    <div class="shape pencil pencil-2">
      <div class="pencil-body"></div>
      <div class="pencil-tip"></div>
    </div>
    <div class="shape orb orb-1"></div>
    <div class="shape orb orb-2"></div>
  </div>

  <div class="container">
    <header class="header">
      <h1 class="gradient-text">Organizador de Rotinas</h1>
      <p>Gerencie seus horários de <strong>Estudo</strong>, <strong>Lazer</strong> e <strong>Trabalho</strong> em um só lugar.</p>
      
      <div class="header-actions">
        <div class="filter-group">
          <button class="filter-btn active" onclick="filterCategory('todas', this)">Todas</button>
          <button class="filter-btn" onclick="filterCategory('Estudo', this)">Estudos</button>
          <button class="filter-btn" onclick="filterCategory('Trabalho', this)">Trabalho</button>
          <button class="filter-btn" onclick="filterCategory('Lazer', this)">Lazer</button>
        </div>

        <button class="btn-primary" onclick="openModal('add')">
          <i data-lucide="plus"></i> Nova Rotina
        </button>
      </div>
    </header>

    <main class="cards-grid" id="cardsGrid">
      <!-- Renderizado via JavaScript -->
    </main>
  </div>

  <!-- Modal para Criar / Editar Rotina -->
  <div class="modal-overlay" id="routineModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle" class="gradient-text">Nova Rotina</h2>
      
      <form id="routineForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="routineId">
        
        <div class="form-group">
          <label for="title">Título / Atividade</label>
          <input type="text" id="title" placeholder="Ex: Matemática, Almoço em Família, Expediente Tarde" required>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="category">Categoria</label>
            <select id="category" onchange="updateSubtypeOptions()" required>
              <option value="Estudo">Estudo</option>
              <option value="Trabalho">Trabalho</option>
              <option value="Lazer">Lazer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="day">Dia da Semana</label>
            <select id="day" required>
              <option value="Segunda-feira">Segunda-feira</option>
              <option value="Terça-feira">Terça-feira</option>
              <option value="Quarta-feira">Quarta-feira</option>
              <option value="Quinta-feira">Quinta-feira</option>
              <option value="Sexta-feira">Sexta-feira</option>
              <option value="Sábado">Sábado</option>
              <option value="Domingo">Domingo</option>
            </select>
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="time">Horário</label>
            <input type="text" id="time" placeholder="Ex: 13:00 - 17:00" required>
          </div>
          <div class="form-group">
            <label for="subtype" id="subtypeLabel">Especificação</label>
            <input type="text" id="subtype" placeholder="Ex: Matéria, Subcategoria ou Foco" required>
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Anotações / Metas detalhadas</label>
          <textarea id="notes" rows="3" placeholder="Detalhes da atividade, metas ou observações importantes..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar Rotina</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Embutido -->
  <script>
    // Rotinas pré-definidas conforme os requisitos
    let routines = [
      // Estudos: Matéria diferente por dia
      { id: '1', title: 'Matemática & Raciocínio', category: 'Estudo', day: 'Segunda-feira', time: '08:00 - 10:00', subtype: 'Matemática', notes: 'Resolução de exercícios e revisão de fórmulas.' },
      { id: '2', title: 'Física Clássica', category: 'Estudo', day: 'Terça-feira', time: '08:00 - 10:00', subtype: 'Física', notes: 'Estudo de Mecânica e Leis de Newton.' },
      { id: '3', title: 'Química Orgânica', category: 'Estudo', day: 'Quarta-feira', time: '08:00 - 10:00', subtype: 'Química', notes: 'Cadeias carbônicas e funções orgânicas.' },
      { id: '4', title: 'História Geral', category: 'Estudo', day: 'Quinta-feira', time: '08:00 - 10:00', subtype: 'História', notes: 'Resumos sobre Idade Contemporânea.' },
      { id: '5', title: 'Geografia & Atualidades', category: 'Estudo', day: 'Sexta-feira', time: '08:00 - 10:00', subtype: 'Geografia', notes: 'Geopolítica e leitura de notícias globais.' },
      { id: '6', title: 'Biologia Celular', category: 'Estudo', day: 'Sábado', time: '09:00 - 11:00', subtype: 'Biologia', notes: 'Citologia e genética básica.' },
      { id: '7', title: 'Literatura & Redação', category: 'Estudo', day: 'Domingo', time: '09:00 - 11:00', subtype: 'Português', notes: 'Escrita de redação e análise de obras.' },

      // Trabalho: Tardes das 13h às 17h
      { id: '8', title: 'Expediente da Tarde', category: 'Trabalho', day: 'Segunda-feira', time: '13:00 - 17:00', subtype: 'Foco em Projetos', notes: 'Desenvolvimento das demandas prioritárias da semana.' },
      { id: '9', title: 'Expediente da Tarde', category: 'Trabalho', day: 'Terça-feira', time: '13:00 - 17:00', subtype: 'Reuniões & Entregas', notes: 'Alinhamentos de equipe e revisão de tarefas.' },
      { id: '10', title: 'Expediente da Tarde', category: 'Trabalho', day: 'Quarta-feira', time: '13:00 - 17:00', subtype: 'Produção', notes: 'Execução técnica dos entregáveis.' },
      { id: '11', title: 'Expediente da Tarde', category: 'Trabalho', day: 'Quinta-feira', time: '13:00 - 17:00', subtype: 'Relatórios & Análises', notes: 'Análise de métricas e relatórios de progresso.' },
      { id: '12', title: 'Expediente da Tarde', category: 'Trabalho', day: 'Sexta-feira', time: '13:00 - 17:00', subtype: 'Fechamento Semanal', notes: 'Finalização de pendências e planejamento da próxima semana.' },

      // Lazer: Família, Amigos e Tempo Sozinha
      { id: '13', title: 'Almoço & Conversa em Família', category: 'Lazer', day: 'Domingo', time: '12:00 - 15:00', subtype: 'Família', notes: 'Tempo de qualidade com os familiares.' },
      { id: '14', title: 'Encontro com Amigos', category: 'Lazer', day: 'Sábado', time: '18:00 - 21:00', subtype: 'Amigos', notes: 'Sair para conversar, lanchar ou jogar algo juntos.' },
      { id: '15', title: 'Momento de Autocuidado', category: 'Lazer', day: 'Quarta-feira', time: '18:30 - 20:00', subtype: 'Tempo Sozinha', notes: 'Leitura por prazer, skincare ou ouvir música relaxante.' }
    ];

    let currentFilter = 'todas';

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'todas' 
        ? routines 
        : routines.filter(r => r.category === currentFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">Nenhuma rotina cadastrada para este filtro.</div>`;
        return;
      }

      filtered.forEach(item => {
        const categoryClass = item.category.toLowerCase();
        const card = document.createElement('div');
        card.className = `card border-${categoryClass}`;
        card.innerHTML = `
          <div class="card-header">
            <span class="badge badge-${categoryClass}">${item.category}</span>
            <span class="card-time"><i data-lucide="clock"></i> ${item.time}</span>
          </div>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-day"><i data-lucide="calendar"></i> ${item.day}</p>
          <p class="card-focal"><strong>Detalhe / Foco:</strong> ${item.subtype}</p>
          <p class="card-notes">${item.notes}</p>
          <div class="card-footer">
            <button class="btn-card" onclick="openModal('edit', '${item.id}')">
              <i data-lucide="edit-3"></i> Editar
            </button>
            <button class="btn-card btn-delete" onclick="deleteRoutine('${item.id}')">
              <i data-lucide="trash-2"></i> Excluir
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function filterCategory(category, buttonEl) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (buttonEl) buttonEl.classList.add('active');
      renderCards();
    }

    function updateSubtypeOptions() {
      const cat = document.getElementById('category').value;
      const label = document.getElementById('subtypeLabel');
      const input = document.getElementById('subtype');

      if (cat === 'Estudo') {
        label.innerText = 'Matéria';
        input.placeholder = 'Ex: Matemática, História...';
      } else if (cat === 'Lazer') {
        label.innerText = 'Tipo de Lazer';
        input.placeholder = 'Ex: Família, Amigos ou Tempo Sozinha';
      } else {
        label.innerText = 'Foco do Trabalho';
        input.placeholder = 'Ex: Projetos, Reuniões...';
      }
    }

    function openModal(mode, id = null) {
      const modal = document.getElementById('routineModal');
      const form = document.getElementById('routineForm');
      const modalTitle = document.getElementById('modalTitle');

      if (mode === 'add') {
        modalTitle.innerText = 'Nova Rotina';
        form.reset();
        document.getElementById('routineId').value = '';
        updateSubtypeOptions();
      } else if (mode === 'edit' && id) {
        modalTitle.innerText = 'Editar Rotina';
        const item = routines.find(r => r.id === id);
        if (item) {
          document.getElementById('routineId').value = item.id;
          document.getElementById('title').value = item.title;
          document.getElementById('category').value = item.category;
          document.getElementById('day').value = item.day;
          document.getElementById('time').value = item.time;
          document.getElementById('subtype').value = item.subtype;
          document.getElementById('notes').value = item.notes;
          updateSubtypeOptions();
        }
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('routineModal').classList.remove('active');
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const id = document.getElementById('routineId').value;
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const day = document.getElementById('day').value;
      const time = document.getElementById('time').value;
      const subtype = document.getElementById('subtype').value;
      const notes = document.getElementById('notes').value;

      if (id) {
        routines = routines.map(r => r.id === id ? { id, title, category, day, time, subtype, notes } : r);
      } else {
        routines.push({ id: Date.now().toString(), title, category, day, time, subtype, notes });
      }

      closeModal();
      renderCards();
    }

    function deleteRoutine(id) {
      if (confirm('Tem certeza de que deseja remover esta rotina?')) {
        routines = routines.filter(r => r.id !== id);
        renderCards();
      }
    }

    window.onclick = function(event) {
      const modal = document.getElementById('routineModal');
      if (event.target === modal) closeModal();
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderCards();
    });
  </script>
</body>
</html>
